spring.application.name=AuthenticationBackend

server.forward-headers-strategy=native

spring.datasource.url=jdbc:postgresql://${DB_HOST:home.local}:${DB_PORT:5432}/${DB_NAME:auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:super_secret_password_123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true

springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.github.bgrebennikov.authenticationbackend.controller


spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://home.local:8080/.well-known/jwks.json
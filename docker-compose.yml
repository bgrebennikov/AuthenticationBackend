version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - auth-network

  auth_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-backend-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=super_secret_password_123
      - JWT_PRIVATE_KEY=file:/app/certs/app.der
      - JWT_PUBLIC_KEY=file:/app/certs/app.pub.der
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - postgres_db
    networks:
      - auth-network

volumes:
  pgdata:

networks:
  auth-network:
    driver: bridge